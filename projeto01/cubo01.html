<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Gustavo André">
    <meta name="description" content="Página de login da Nova Cubos Technology">
    <title>Nova Cubos | Entrar</title>

    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="icon" href="assets/imagens/favicon-16x16.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pridi:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="auth-layout">
        <aside class="auth-hero" aria-label="Apresentação da Nova Cubos Technology">
            <header class="hero-header">
                <p class="hero-eyebrow">Nova</p>
                <h1 class="hero-title">Cubos <span>Tecnology</span></h1>
                <p class="hero-text">Na busca incessante pela inovação, a seriedade é nossa aliada. Cada avanço que
                    fazemos molda o futuro da tecnologia.</p>
            </header>

            <figure class="hero-figure">
                <img src="assets/imagens/viagem.jpg" alt="Profissionais colaborando em um ambiente de inovação">
            </figure>

            <footer class="hero-footer">
                <p class="hero-cta-text">Ainda não tem conta?</p>
                <a class="hero-cta" href="cubo02.html">Criar conta</a>
            </footer>
        </aside>

        <main class="auth-card" aria-labelledby="auth-title">
            <header class="auth-header">
                <img src="assets/imagens/cube.png" alt="Logotipo Nova Cubos" class="auth-logo">
                <h2 id="auth-title">Bem-vindo de volta</h2>
                <p>Entre usando seu e-mail e senha para continuar.</p>
            </header>

            <form class="auth-form" action="#" method="post">
                <div class="field" data-field>
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <img src="assets/imagens/user.png" alt="" class="input-icon" aria-hidden="true">
                        <input id="email" name="email" type="email" autocomplete="email" placeholder="nome@empresa.com" required>
                    </div>
                </div>

                <div class="field" data-field>
                    <label for="password">Senha</label>
                    <div class="input-wrapper">
                        <img src="assets/imagens/password.png" alt="" class="input-icon" aria-hidden="true">
                        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
                    </div>
                    <a class="field-link" href="#">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="button button-primary">Entrar</button>
            </form>
        </main>
    </div>
</body>

</html>
